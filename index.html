<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#101012">
    <title>Time Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@300;400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body data-mode="stopwatch">
    <div class="app">

        <header class="top">
            <nav class="modes" id="modes">
                <button class="mode active" data-mode="stopwatch">Stopwatch</button>
                <button class="mode" data-mode="timer">Timer</button>
            </nav>
            <span class="today" id="today"></span>
        </header>

        <input id="task" class="task" type="text" placeholder="Working on?" maxlength="80"
            autocomplete="off">

        <div class="clock" id="clock">
            <span class="clock-main" id="clockMain">00:00:00</span><span class="clock-cs" id="clockCs">.00</span>
        </div>

        <div class="progress" id="progress">
            <div class="progress-fill" id="progressFill"></div>
        </div>

        <div class="setup" id="setup">
            <div class="field"><input id="inH" type="number" min="0" max="99" value="0"
                    inputmode="numeric"><label>Hrs</label></div>
            <div class="field"><input id="inMin" type="number" min="0" max="59" value="25"
                    inputmode="numeric"><label>Min</label></div>
            <div class="field"><input id="inSec" type="number" min="0" max="59" value="0"
                    inputmode="numeric"><label>Sec</label></div>
        </div>

        <div class="presets" id="presets">
            <button type="button" data-sec="300">5m</button>
            <button type="button" data-sec="900">15m</button>
            <button type="button" data-sec="1500">25m</button>
            <button type="button" data-sec="2700">45m</button>
            <button type="button" data-sec="3600">1h</button>
        </div>

        <div class="buttons">
            <button id="btnStart" class="btn primary">Start</button>
            <button id="btnReset" class="btn">Reset</button>
            <button id="btnSave" class="btn">Save</button>
        </div>

        <p class="hint"><kbd>Space</kbd> pause · <kbd>R</kbd> reset · <kbd>S</kbd> save</p>

        <section class="log">
            <div class="log-head">
                <span class="log-title">Log</span>
                <span class="log-total" id="total"></span>
                <button class="link" id="btnClear">Clear</button>
            </div>
            <ul class="log-list" id="list"></ul>
            <p class="log-empty" id="empty">No sessions yet</p>
        </section>

    </div>

    <div class="toast" id="toast"></div>

    <script src="js/script.js"></script>
</body>

</html>
